<style>
:root { --bg: #f5f7f9; --ink: #15181c; --accent: oklch(0.5 0.13 240); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
* { box-sizing: border-box; }
body { font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
a:hover { color: var(--ink); }
button:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input::placeholder { color: var(--muted); opacity: 1; }
button:disabled { cursor: not-allowed; }
.lift { transition: transform .25s cubic-bezier(.16,1,.3,1); }
.lift:hover { transform: translateY(-2px); }
.press:active { transform: scale(0.98); }
.hov-ink:hover { border-color: var(--ink) !important; }
.bar { transition: width .5s cubic-bezier(.16,1,.3,1); }
.knob { transition: transform .25s cubic-bezier(.16,1,.3,1); }
[dir=rtl] { --kx: -1; }
[dir=rtl] .ph-arrow-right, [dir=rtl] .ph-caret-right, [dir=rtl] .ph-arrow-left { transform: scaleX(-1); }
.seg:focus-visible { outline-offset: -2px; position: relative; z-index: 1; }
.spin { display: inline-block; animation: locus-spin 1s linear infinite; }
.pulse { animation: locus-pulse 1.2s ease-in-out infinite; }
@keyframes locus-spin { to { transform: rotate(360deg); } }
@keyframes locus-pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@media print {
  html, body { height: auto; background: #fff !important; }
  [data-locus-root] { position: static !important; display: block !important; overflow: visible !important; background: #fff !important; }
  .locus-shell, [data-noprint] { display: none !important; }
  [data-print-root] { position: static !important; overflow: visible !important; background: #fff !important; }
  [data-print-root] article { box-shadow: none !important; margin: 0 auto !important; padding: 0 !important; }
}
</style>
